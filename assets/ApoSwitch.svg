  <g id="charcoal-base" filter="url(#tile-shadow)">
    <use href="#tile-shape" fill="url(#tile-body)"/>
    <use href="#tile-shape" fill="url(#tile-left-light)"/>
    <use href="#tile-shape" fill="url(#tile-right-shade)"/>
    <g clip-path="url(#tile-clip)">
      <ellipse cx="661" cy="866" rx="552" ry="348" fill="url(#plate-contact-shade)"/>
    </g>
    <use href="#tile-shape" stroke="url(#tile-edge)" stroke-width="3.6"/>
    <use href="#tile-shape" stroke="url(#tile-bevel-light)" stroke-width="14" filter="url(#soft-edge)" clip-path="url(#tile-clip)"/>
    <path d="M 320 98 H 934 C 1078 98 1161 181 1161 325 V 924 C 1161 1068 1078 1151 934 1151 H 320 C 176 1151 92 1068 92 924 V 325 C 92 181 176 98 320 98 Z" stroke="url(#tile-inner-edge)" stroke-width="1.3"/>
  </g>

  <g id="blue-gear-plate">
    <circle id="outer-bevel" cx="624.5" cy="615.5" r="438.5" fill="url(#plate-bevel)" stroke="url(#plate-outline)" stroke-width="1.6" filter="url(#plate-shadow)"/>
    <circle cx="624.5" cy="615.5" r="438" fill="url(#plate-bevel-shade)"/>
    <circle id="enamel-face" cx="624.5" cy="615.5" r="425.7" fill="url(#face-fill)" stroke="url(#face-edge)" stroke-width="1.6"/>
    <circle cx="624.5" cy="615.5" r="424.7" fill="url(#face-soft-light)"/>
    <circle id="inset-circular-line" cx="624.5" cy="615.5" r="386" stroke="url(#inset-ring)" stroke-width="6.2"/>
    <path id="upper-rim-highlight" d="M 303 320 A 438.5 438.5 0 0 1 842 234" stroke="url(#rim-glint)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="h-pattern-rails" filter="url(#rail-shadow)">
    <use href="#h-shape" fill="url(#rail-ivory)" stroke="url(#rail-edge)" stroke-width="1.5" stroke-linejoin="round" filter="url(#rail-bevel)"/>
    <path d="M 449 609 H 602 M 652 609 H 805" stroke="#FAFDFF" stroke-opacity=".38" stroke-width="1.7"/>
  </g>

  <g id="selected-position-marker" filter="url(#marker-shadow)">
    <circle cx="425" cy="446" r="45.2" fill="url(#marker-fill)" stroke="url(#marker-edge)" stroke-width="1.5"/>
    <circle cx="425" cy="446" r="44.3" fill="url(#marker-sheen)"/>
    <path d="M 389 428 A 40 40 0 0 1 432 405" stroke="#D5FAFF" stroke-opacity=".38" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
