<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">APO Switch — manual gearshift icon</title>
  <desc id="icon-desc">An editable vector reconstruction of the approved icon: a blue circular gear plate on a charcoal rounded-square base, pale H-pattern rails, and a cyan upper-left position marker.</desc>
  <defs>
    <!-- Native vector geometry. No embedded raster images, fonts, or external resources. -->
    <path id="tile-shape" d="M 320 92 H 934 C 1083 92 1167 176 1167 325 V 924 C 1167 1073 1083 1157 934 1157 H 320 C 171 1157 86 1073 86 924 V 325 C 86 176 171 92 320 92 Z"/>
    <path id="h-shape" d="M 424 418 C 437 418 447 428 447 441 V 607 H 604 V 441 C 604 428 614 418 627 418 C 640 418 650 428 650 441 V 607 H 807 V 439 C 807 426 817 416 830 416 C 843 416 853 426 853 439 V 821 C 853 834 843 844 830 844 C 817 844 807 834 807 821 V 651 H 650 V 821 C 650 834 640 844 627 844 C 614 844 604 834 604 821 V 651 H 447 V 821 C 447 834 437 844 424 844 C 411 844 401 834 401 821 V 441 C 401 428 411 418 424 418 Z"/>

    <linearGradient id="tile-body" x1="627" y1="92" x2="627" y2="1157" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46494F"/>
      <stop offset=".05" stop-color="#3A3D43"/>
      <stop offset=".10" stop-color="#383B41"/>
      <stop offset=".31" stop-color="#2D2F34"/>
      <stop offset=".57" stop-color="#242529"/>
      <stop offset=".82" stop-color="#18191C"/>
      <stop offset="1" stop-color="#17181B"/>
    </linearGradient>
    <radialGradient id="tile-left-light" cx="184" cy="327" r="835" gradientTransform="translate(184 327) scale(1 .88) translate(-184 -327)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7BDC7" stop-opacity=".14"/>
      <stop offset=".48" stop-color="#A1A8B4" stop-opacity=".055"/>
      <stop offset="1" stop-color="#A1A8B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile-right-shade" x1="680" y1="600" x2="1167" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="tile-edge" x1="254" y1="92" x2="1017" y2="1142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8EAEE" stop-opacity=".88"/>
      <stop offset=".20" stop-color="#BEC1C9" stop-opacity=".46"/>
      <stop offset=".48" stop-color="#666A73" stop-opacity=".12"/>
      <stop offset=".72" stop-color="#26292F" stop-opacity=".56"/>
      <stop offset="1" stop-color="#090A0C" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="tile-inner-edge" x1="627" y1="97" x2="627" y2="1150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFC3CA" stop-opacity=".42"/>
      <stop offset=".14" stop-color="#A3A7AE" stop-opacity=".14"/>
      <stop offset=".56" stop-color="#272A30" stop-opacity=".12"/>
      <stop offset="1" stop-color="#656871" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="tile-bevel-light" x1="194" y1="91" x2="817" y2="949" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F6FD" stop-opacity=".80"/>
      <stop offset=".30" stop-color="#DEE5EF" stop-opacity=".29"/>
      <stop offset=".65" stop-color="#DEE5EF" stop-opacity=".03"/>
      <stop offset="1" stop-color="#DEE5EF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="plate-contact-shade" cx="661" cy="866" r="552" gradientTransform="translate(661 866) scale(1 .63) translate(-661 -866)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity=".53"/>
      <stop offset=".69" stop-color="#000000" stop-opacity=".28"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="plate-bevel" cx="624.5" cy="615.5" r="438.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#254771"/>
      <stop offset=".964" stop-color="#254771"/>
      <stop offset=".972" stop-color="#325A8D"/>
      <stop offset=".982" stop-color="#446FA8"/>
      <stop offset=".989" stop-color="#91BFF0"/>
      <stop offset="1" stop-color="#DEF4FF"/>
    </radialGradient>
    <linearGradient id="plate-bevel-shade" x1="277" y1="181" x2="949" y2="1050" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19365E" stop-opacity="0"/>
      <stop offset=".30" stop-color="#19365E" stop-opacity=".10"/>
      <stop offset=".65" stop-color="#122B4C" stop-opacity=".45"/>
      <stop offset="1" stop-color="#112C50" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="plate-outline" x1="351" y1="222" x2="891" y2="1019" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FF"/>
      <stop offset=".27" stop-color="#8EB9E9"/>
      <stop offset=".62" stop-color="#254575"/>
      <stop offset="1" stop-color="#74A2D8"/>
    </linearGradient>
    <linearGradient id="face-fill" x1="624.5" y1="190" x2="624.5" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3C6491"/>
      <stop offset=".06" stop-color="#365A86"/>
      <stop offset=".11" stop-color="#32537E"/>
      <stop offset=".17" stop-color="#2B4C76"/>
      <stop offset=".36" stop-color="#1F3C60"/>
      <stop offset=".66" stop-color="#142D4C"/>
      <stop offset=".87" stop-color="#0F2543"/>
      <stop offset="1" stop-color="#0D223E"/>
    </linearGradient>
    <radialGradient id="face-soft-light" cx="388" cy="365" r="601" gradientTransform="translate(388 365) scale(1 1.08) translate(-388 -365)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B9CCF" stop-opacity=".10"/>
      <stop offset=".52" stop-color="#4A7CB2" stop-opacity=".04"/>
      <stop offset="1" stop-color="#4A7CB2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face-edge" x1="339" y1="238" x2="917" y2="994" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23446D"/>
      <stop offset=".44" stop-color="#1B385E"/>
      <stop offset="1" stop-color="#6B94C2" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="inset-ring" x1="625" y1="226" x2="625" y2="1005" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5F91C8"/>
      <stop offset=".36" stop-color="#4575AA"/>
      <stop offset=".75" stop-color="#315C90"/>
      <stop offset="1" stop-color="#345F96"/>
    </linearGradient>
    <linearGradient id="rim-glint" x1="319" y1="245" x2="757" y2="233" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".33" stop-color="#EFFBFF" stop-opacity=".90"/>
      <stop offset=".70" stop-color="#CBEAFF" stop-opacity=".60"/>
      <stop offset="1" stop-color="#8DB6E5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rail-ivory" x1="627" y1="416" x2="627" y2="846" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FCFE"/>
      <stop offset=".20" stop-color="#EAF1F8"/>
      <stop offset=".50" stop-color="#DCE6EF"/>
      <stop offset=".74" stop-color="#D5E1ED"/>
      <stop offset="1" stop-color="#C7D9E9"/>
    </linearGradient>
    <linearGradient id="rail-edge" x1="428" y1="420" x2="829" y2="844" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFEFF" stop-opacity=".92"/>
      <stop offset=".40" stop-color="#D8E6F2" stop-opacity=".64"/>
      <stop offset="1" stop-color="#89ACC9" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="marker-fill" x1="402" y1="408" x2="447" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9FEFFF"/>
      <stop offset=".27" stop-color="#73E2FE"/>
      <stop offset=".58" stop-color="#39CDF6"/>
      <stop offset="1" stop-color="#0BAFE4"/>
    </linearGradient>
    <radialGradient id="marker-sheen" cx="408" cy="420" r="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1FDFF" stop-opacity=".13"/>
      <stop offset=".55" stop-color="#E5FCFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#E5FCFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marker-edge" x1="402" y1="408" x2="450" y2="483" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7FAFF"/>
      <stop offset=".42" stop-color="#73DAF5"/>
      <stop offset="1" stop-color="#127BA8"/>
    </linearGradient>

    <clipPath id="tile-clip"><use href="#tile-shape"/></clipPath>
    <filter id="soft-edge" x="50" y="56" width="1153" height="1137" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.8"/>
    </filter>
    <filter id="tile-shadow" x="35" y="70" width="1190" height="1147" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="2" dy="9" result="offset"/>
      <feFlood flood-color="#020306" flood-opacity=".26"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="plate-shadow" x="150" y="146" width="965" height="969" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="6" dy="14" result="offset"/>
      <feFlood flood-color="#020611" flood-opacity=".66"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rail-shadow" x="378" y="395" width="504" height="484" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="5" result="offset"/>
      <feFlood flood-color="#030D20" flood-opacity=".72"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rail-bevel" x="392" y="407" width="470" height="448" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.45" result="soft-alpha"/>
      <feOffset in="soft-alpha" dx="1" dy="2" result="down-alpha"/>
      <feComposite in="SourceAlpha" in2="down-alpha" operator="out" result="upper-edge"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".72"/>
      <feComposite in2="upper-edge" operator="in" result="edge-light"/>
      <feOffset in="soft-alpha" dx="-1" dy="-2" result="up-alpha"/>
      <feComposite in="SourceAlpha" in2="up-alpha" operator="out" result="lower-edge"/>
      <feFlood flood-color="#6A8EAD" flood-opacity=".38"/>
      <feComposite in2="lower-edge" operator="in" result="edge-shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="edge-light"/><feMergeNode in="edge-shade"/></feMerge>
    </filter>
    <filter id="marker-shadow" x="365" y="390" width="128" height="125" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.1" result="blur"/>
      <feOffset in="blur" dx="2" dy="4.6" result="offset"/>
      <feFlood flood-color="#03192B" flood-opacity=".64"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
